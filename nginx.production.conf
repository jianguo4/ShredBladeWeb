# Nginx 生产环境配置 - 同时处理前端和后端域名，优化性能

# 前端域名 - www.shredderbladesdirect.com
server {
    listen 80;
    server_name www.shredderbladesdirect.com shredderbladesdirect.com;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ========== 压缩配置 ==========
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/json 
        application/xml+rss 
        application/atom+xml
        image/svg+xml;
    gzip_disable "msie6";

    # ========== 缓存策略 ==========
    
    # 视频文件 - 长期缓存 (30天)
    location ~* \.(mp4|webm|mov|avi)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # 预加载视频文件，减少首次加载等待时间
        add_header Accept-Ranges "bytes";
    }

    # 图片文件 - 长期缓存 (30天)，支持多种格式，禁止直接下载
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        # 禁止直接下载图片：设置为 inline 在浏览器显示，不允许下载
        add_header Content-Disposition "inline; filename=$request_filename";
        # 设置 referer 限制 - 只允许同域访问
        valid_referers none blocked ~^https?://(.+\.)?(shredderbladesdirect\.com|localhost|127\.0\.0\.1) ~^https?://www\.shredderbladesdirect\.com;
        if ($invalid_referer) {
            return 403;
        }
        # WebP 图片特定的优化
        location ~* \.webp$ {
            add_header Content-Type "image/webp";
        }
    }

    # 静态资源 (JS, CSS) - 中期缓存 (7天)
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }

    # 字体文件 - 长期缓存 (1年)
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML 和 manifest 文件 - 禁用缓存，每次检查
    location ~* \.(html|json|manifest|xml|txt)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ========== API 代理 ==========
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 转发请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲以支持流媒体
        proxy_buffering off;
    }

    # ========== SPA 路由 ==========
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ========== 安全配置 ==========
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 禁止访问备份文件
    location ~ ~$ {
        deny all;
    }

    # 处理 404 返回 index.html
    error_page 404 =200 /index.html;

    # 性能监控
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# 后端 API 域名 - api.shredderbladesdirect.com
server {
    listen 80;
    server_name api.shredderbladesdirect.com;

    # 所有请求代理到后端容器
    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # 转发请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲
        proxy_buffering off;
    }
}
