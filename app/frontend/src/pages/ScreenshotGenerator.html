<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面长图生成工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        
        .pages-list {
            margin-bottom: 25px;
        }
        
        .pages-list h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .page-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .page-item:last-child {
            border-bottom: none;
        }
        
        .page-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .page-item label {
            cursor: pointer;
            flex: 1;
            font-size: 13px;
            color: #555;
        }
        
        .page-item .path {
            color: #999;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .settings {
            background: #fafafa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }
        
        .setting-group {
            margin-bottom: 12px;
        }
        
        .setting-group:last-child {
            margin-bottom: 0;
        }
        
        .setting-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .setting-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-select-all {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-select-all:hover {
            background: #e0e0e0;
        }
        
        .progress {
            display: none;
            margin-top: 25px;
        }
        
        .progress.active {
            display: block;
        }
        
        .progress-title {
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }
        
        .status-message.success {
            display: block;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .status-message.error {
            display: block;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .status-message.info {
            display: block;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 页面长图生成工具</h1>
        <p class="subtitle">为网站页面生成高质量的长图截图</p>
        
        <div class="info-box">
            <strong>⚠️ 使用说明：</strong><br>
            1. 确保项目开发服务器正在运行 (npm run dev)<br>
            2. 选择要生成长图的页面<br>
            3. 点击"生成长图"按钮<br>
            4. 长图将自动下载或保存到本地
        </div>
        
        <div class="pages-list">
            <h3>📄 选择页面</h3>
            <div id="pagesContainer"></div>
        </div>
        
        <div class="settings">
            <div class="setting-group">
                <label for="imageWidth">截图宽度 (px)</label>
                <input type="number" id="imageWidth" value="1200" min="600" max="2400">
            </div>
            <div class="setting-group">
                <label for="imageQuality">图片质量 (0-1)</label>
                <input type="number" id="imageQuality" value="0.95" min="0.1" max="1" step="0.05">
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-select-all" onclick="toggleSelectAll()">全选/全不选</button>
            <button class="btn-generate" onclick="generateScreenshots()" id="generateBtn">🚀 生成长图</button>
        </div>
        
        <div class="progress" id="progress">
            <div class="progress-title">生成进度：</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text"><span id="progressText">0/0</span></div>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        // 页面配置
        const pages = [
            { name: '首页', path: '/', filename: 'index-home' },
            { name: '关于我们', path: '/about-us', filename: 'about-us' },
            { name: '粉碎机刀片', path: '/shredder-blades', filename: 'shredder-blades' },
            { name: '单轴粉碎机刀片', path: '/single-shaft-shredder-blades', filename: 'single-shaft' },
            { name: '双轴粉碎机刀片', path: '/double-shaft-shredder-blades', filename: 'double-shaft' },
            { name: '四轴粉碎机刀片', path: '/four-shaft-shredder-blades', filename: 'four-shaft' },
            { name: '金属废料剪', path: '/metal-scrap-shears', filename: 'metal-scrap-shears' },
            { name: '塑料回收', path: '/plastic-recycling-blades', filename: 'plastic-recycling' },
            { name: '电子废物数据销毁', path: '/ewaste-data-destruction', filename: 'ewaste' },
            { name: '轮胎粉碎刀具', path: '/tire-shredder-knives', filename: 'tire-shredder' },
            { name: '固体废物 RDF', path: '/solid-waste-rdf-blades', filename: 'solid-waste-rdf' },
            { name: '城市固体废物回收', path: '/solid-waste-rdf-blades-msw', filename: 'municipal-waste' },
            { name: '联系我们', path: '/contact-us', filename: 'contact-us' },
        ];

        // 初始化页面列表
        function initPages() {
            const container = document.getElementById('pagesContainer');
            container.innerHTML = pages.map((page, index) => `
                <div class="page-item">
                    <input type="checkbox" id="page-${index}" class="page-checkbox" checked>
                    <label for="page-${index}">${page.name}</label>
                    <span class="path">${page.path}</span>
                </div>
            `).join('');
        }

        // 切换全选
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.page-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        // 显示状态消息
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
        }

        // 获取选中的页面
        function getSelectedPages() {
            const checkboxes = document.querySelectorAll('.page-checkbox:checked');
            const selectedIndices = Array.from(checkboxes).map(cb => 
                parseInt(cb.id.replace('page-', ''))
            );
            return selectedIndices.map(i => pages[i]);
        }

        // 生成长图
        async function generateScreenshots() {
            const selectedPages = getSelectedPages();
            
            if (selectedPages.length === 0) {
                showStatus('❌ 请至少选择一个页面', 'error');
                return;
            }

            const width = parseInt(document.getElementById('imageWidth').value);
            const quality = parseFloat(document.getElementById('imageQuality').value);
            
            const generateBtn = document.getElementById('generateBtn');
            const progress = document.getElementById('progress');
            
            generateBtn.disabled = true;
            progress.classList.add('active');
            showStatus(`📸 正在生成 ${selectedPages.length} 张长图...`, 'info');

            let successCount = 0;
            let failureCount = 0;

            for (let i = 0; i < selectedPages.length; i++) {
                const page = selectedPages[i];
                const progressPercent = Math.round(((i + 1) / selectedPages.length) * 100);
                
                document.getElementById('progressFill').style.width = progressPercent + '%';
                document.getElementById('progressText').textContent = `${i + 1}/${selectedPages.length}`;

                try {
                    showStatus(`⏳ 正在生成: ${page.name}...`, 'info');
                    
                    // 创建隐藏的 iframe 加载页面
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = page.path;
                    document.body.appendChild(iframe);

                    // 等待页面加载
                    await new Promise(resolve => {
                        iframe.onload = () => setTimeout(resolve, 3000);
                    });

                    // 获取页面内容并截图
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const element = iframeDoc.documentElement;

                    const canvas = await html2canvas(element, {
                        width: width,
                        backgroundColor: '#ffffff',
                        scale: 2,
                        logging: false,
                        useCORS: true,
                        allowTaint: true,
                    });

                    // 下载图片
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png', quality);
                    link.download = `${page.filename}-${new Date().toISOString().split('T')[0]}.png`;
                    link.click();

                    document.body.removeChild(iframe);
                    successCount++;

                } catch (error) {
                    console.error(`生成 ${page.name} 失败:`, error);
                    failureCount++;
                }
            }

            // 完成
            generateBtn.disabled = false;
            progress.classList.remove('active');
            
            const message = `✅ 完成！成功: ${successCount}, 失败: ${failureCount}`;
            showStatus(message, failureCount === 0 ? 'success' : 'error');
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', initPages);
    </script>
</body>
</html>
